
<!-- Country Management Filter -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{config.i18n.labelText}}</mat-label>
      <mat-select [formControl]="selectedCountry" (selectionChange)="onCountrySelected($event)">
        <mat-option *ngFor="let country of countries" [value]="country.id">
          {{ country.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
