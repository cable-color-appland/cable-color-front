<div class="container-component">
  <h1>Gestión de Roles</h1>

  <!-- add country by super admin -->
  <div class="row">
    <div class="col-md-6">
      <app-country-management-filter [hidden]="!displayCountryManagement" [selectedCountryId]="selectedCountry"
        (countrySelected)="onCountrySelected($event)">
      </app-country-management-filter>
    </div>
    <div class="col-md-6">
      <button *ngIf="showButtonCreateRole" color="accent" mat-raised-button (click)="toggleAddRole()">
        Crear Rol
      </button>
    </div>
  </div>
  <div *ngIf="showAddRoleInput" class="add-role-form">
    <form [formGroup]="RolesForm">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Nombre del Rol</mat-label>
        <input matInput formControlName="RoleName" maxlength="50" />
        <!-- Mensajes de error -->
        <mat-error *ngIf="RolesForm.get('RoleName')?.hasError('required')">
          El nombre del rol es obligatorio
        </mat-error>
        <mat-error *ngIf="RolesForm.get('RoleName')?.hasError('minlength')">
          El nombre debe tener al menos 3 caracteres
        </mat-error>
      </mat-form-field>
      <div class="action-buttons">
        <button mat-raised-button (click)="addOrEditRole()" [disabled]="RolesForm.invalid" color="primary">
          {{ isEditing ? "Actualizar" : "Agregar" }}
        </button>
        <button mat-raised-button (click)="toggleCancelRole()">cancelar</button>
      </div>
    </form>
  </div>
  <!-- <div class="mat-elevation-z8"> -->
    <!-- Tabla de roles -->
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width">
      <!-- Nombre del Rol Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let role">{{ role.name }}</td>
      </ng-container>
  
      <!-- Acción Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acción</th>
        <td mat-cell *matCellDef="let role">
          <button mat-icon-button color="primary" (click)="editRole(role)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <!-- Paginador -->
    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons>
    </mat-paginator>
  <!-- </div> -->
</div>
