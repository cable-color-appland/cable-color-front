<div class="container-component">
  <br />
  <div class="col-md-12">
    <mat-card>
      <mat-card-header>
        <mat-card-title>
          {{config.i18n.title}}
        </mat-card-title>
      </mat-card-header>
    </mat-card>
  </div>

  <hr />

  <div class="row">
    <div class="col-md-6">
      <!-- add country depends on the role -->
      <app-country-management-filter [hidden]="!displayCountryManagement"
        [selectedCountryId]="selectedCountry"
        (countrySelected)="onCountrySelected($event)"></app-country-management-filter>
    </div>
    <div class="offset-md-3 col-md-3">
      <mat-card>
        <a mat-raised-button color="accent" routerLink="create">{{ config.i18n.createButton }}</a>
      </mat-card>
    </div>
  </div>

  <div-col-md-12>
    <div class="table-responsive">
      <table mat-table class="table table-striped" cdkTable [dataSource]="typeRequests" #tableTypeRequest>
        <!-- type request name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header id="name">
            <strong>{{ config.i18n.nameLabel }}</strong>
          </th>
          <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>

        <!-- role name Column -->
        <ng-container matColumnDef="roleName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header id="roleName">
            <strong>{{ config.i18n.roleLabel }}</strong>
          </th>
          <td mat-cell *matCellDef="let row"> {{row.roleName}} </td>
        </ng-container>

        <!-- country name Column -->
        <ng-container matColumnDef="countryName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header id="countryName">
            <strong>{{ config.i18n.countryLabel }}</strong>
          </th>
          <td mat-cell *matCellDef="let row"> {{row.countryName}} </td>
        </ng-container>

        <!-- actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef mat-sort-header id="actions">
            <strong>{{ config.i18n.actionsLabel }}</strong>
          </th>
          <td mat-cell *matCellDef="let row">
            <a mat-icon-button color="primary" routerLink="modify/{{row.id}}">
              <mat-icon>edit</mat-icon>
            </a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="config.i18n.displayColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: config.i18n.displayColumns;"></tr>

      </table>

      <div *ngIf="noData" class="empty-text" >
        <div class="cont-image">
          <mat-icon>document_search</mat-icon>
        </div>
        <div class="cont-text">
          <p>{{ config.i18n.notRecords }}</p>
        </div>
      </div>

      <!-- Paginador -->
      <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons>
      </mat-paginator>
    </div>
  </div-col-md-12>

</div>
